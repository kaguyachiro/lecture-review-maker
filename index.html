<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의평가 짤 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f4f7;
    --card: #ffffff;
    --text: #1b1b1f;
    --sub: #707078;
    --line: #e3e3ea;
    --accent: #ff9a1f;
    --accent-dark: #e8840a;
    --field: #f7f7fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  header { max-width: 1200px; margin: 0 auto; padding: 28px 16px 8px; }
  header h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--sub); font-size: 15px; }

  .layout {
    max-width: 1200px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 20px;
    align-items: start;
  }
  .panel { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .preview { position: sticky; top: 16px; }
  .preview canvas { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .preview .hint { margin-top: 10px; }

  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; }
  .group { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 10px; }
  label > input, label > textarea, label > .row { margin-top: 5px; }
  input[type=text], input[type=number], textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > button { flex: none; }

  button {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 10px; padding: 10px 14px;
  }
  button:hover { background: var(--field); }
  button.primary {
    width: 100%; background: var(--accent); border-color: var(--accent); color: #fff;
    font-size: 17px; font-weight: 800; padding: 15px;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.ghost { border-style: dashed; width: 100%; color: var(--sub); }

  .review { background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .review textarea, .review input { background: #fff; }
  .review-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
  .review-head button { padding: 4px 10px; font-size: 13px; color: var(--sub); }
  .review .row label { margin-bottom: 0; }
  label.check {
    display: flex; align-items: center; gap: 8px; margin: 10px 0 0;
    font-size: 14px; color: var(--text); cursor: pointer;
  }
  label.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

  .upload-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .upload-row button { flex: none; }
  #fileName { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 6px; }
  .hint { font-size: 12.5px; color: var(--sub); margin: 4px 0 10px; line-height: 1.5; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 18px; padding: 16px; max-width: 520px; width: 100%;
    max-height: 100%; display: flex; flex-direction: column; gap: 12px;
  }
  .modal-box img { width: 100%; min-height: 0; object-fit: contain; border-radius: 10px; border: 1px solid var(--line); }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions > * { flex: 1; text-align: center; text-decoration: none; white-space: nowrap; padding: 12px 8px; }
  .modal-actions a { background: var(--accent); color: #fff; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 15px; }
  #toast { font-size: 13px; color: var(--sub); text-align: center; min-height: 1em; margin: 0; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .preview { position: static; order: -1; }
  }
</style>
</head>
<body>
<header>
  <h1>강의평가 <span>짤 메이커</span></h1>
  <p>캐릭터가 대학 교수라면? 강의명과 평가 댓글을 채우고 캐릭터 사진을 올려보세요.</p>
</header>

<main class="layout">
  <section class="panel">
    <div class="group">
      <h2>강의 정보</h2>
      <label>강의명
        <input type="text" id="title" placeholder="강의명을 입력하세요">
      </label>
      <label>총 평점 (0 ~ 5)
        <div class="row">
          <input type="number" id="total" min="0" max="5" step="0.01" placeholder="예: 1.00">
          <button type="button" id="avgBtn">댓글 평균으로</button>
        </div>
      </label>
    </div>

    <div class="group">
      <h2>평가 댓글</h2>
      <div id="reviews"></div>
      <button type="button" class="ghost" id="addReview">+ 댓글 추가</button>
    </div>

    <div class="group">
      <h2>캐릭터 이미지</h2>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="upload-row">
        <button type="button" id="uploadBtn">이미지 업로드</button>
        <span id="fileName">선택된 이미지 없음</span>
      </div>
      <label>크기 <span id="scaleVal">100%</span>
        <input type="range" id="scale" min="20" max="250" value="100">
      </label>
      <p class="hint">미리보기에서 이미지를 드래그하면 위치를 옮길 수 있어요.<br>배경이 투명한 PNG(누끼 딴 이미지)가 원본 짤처럼 잘 어울려요.</p>
      <button type="button" id="resetPos">위치·크기 초기화</button>
    </div>

    <button type="button" class="primary" id="makeBtn">완성하기</button>
  </section>

  <section class="panel preview">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <p class="hint">미리보기</p>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <img id="outImg" alt="완성된 강의평가 짤">
    <div class="modal-actions">
      <a id="downloadLink" download="강의평가.png">이미지 저장</a>
      <button type="button" id="copyBtn">클립보드 복사</button>
      <button type="button" id="closeBtn">닫기</button>
    </div>
    <p id="toast"></p>
  </div>
</div>

<script>
const W = 1080;
const MIN_H = 1350;
const FONT = 'Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const ORANGE = '#ff9a1f';
const GREY_STAR = '#c6c6cb';
const THUMB = new Path2D('M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3');

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

const state = {
  reviews: [
    { text: '', rating: null, who: '' },
    { text: '', rating: null, who: '' },
    { text: '', rating: null, who: '' },
  ],
  img: null,
  scale: 1,
  dx: 0,
  dy: 0,
};

// ---------- form ----------
function renderReviewForms() {
  const box = $('reviews');
  box.innerHTML = '';
  state.reviews.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'review';
    el.innerHTML = `
      <div class="review-head">
        <span>평가 댓글 ${i + 1}</span>
        ${state.reviews.length > 1 ? '<button type="button" data-act="remove">삭제</button>' : ''}
      </div>
      <label>댓글 (줄바꿈 가능)
        <textarea data-k="text" rows="2" placeholder="평가 댓글을 입력하세요"></textarea>
      </label>
      <div class="row">
        <label>평점 ${i + 1} (0 ~ 5)
          <input type="number" data-k="rating" min="0" max="5" step="0.5" placeholder="0 ~ 5">
        </label>
        <label>수강자 표시
          <input type="text" data-k="who" placeholder="예: 26년 1학기 수강자">
        </label>
      </div>
      <label class="check">
        <input type="checkbox" data-k="deleted"> 삭제된 댓글로 표시
      </label>`;
    el.querySelector('[data-k=text]').value = r.text;
    el.querySelector('[data-k=rating]').value = r.rating ?? '';
    el.querySelector('[data-k=who]').value = r.who;
    el.querySelector('[data-k=deleted]').checked = !!r.deleted;
    el.addEventListener('input', e => {
      const k = e.target.dataset.k;
      if (!k) return;
      r[k] = k === 'rating' ? parseFloat(e.target.value) || 0
           : k === 'deleted' ? e.target.checked
           : e.target.value;
      render();
    });
    const rm = el.querySelector('[data-act=remove]');
    if (rm) rm.addEventListener('click', () => {
      state.reviews.splice(i, 1);
      renderReviewForms();
      render();
    });
    box.appendChild(el);
  });
}

$('addReview').addEventListener('click', () => {
  const last = state.reviews[state.reviews.length - 1];
  state.reviews.push({ text: '', rating: null, who: last ? last.who : '' });
  renderReviewForms();
  render();
});

$('avgBtn').addEventListener('click', () => {
  const rs = state.reviews.map(r => clamp(r.rating, 0, 5));
  const avg = rs.reduce((a, b) => a + b, 0) / (rs.length || 1);
  $('total').value = avg.toFixed(2);
  render();
});

$('title').addEventListener('input', render);
$('total').addEventListener('input', render);

$('uploadBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    state.img = img;
    resetImage();
    $('fileName').textContent = f.name;
    cv.style.touchAction = 'none';
    cv.style.cursor = 'grab';
  };
  img.src = url;
});

$('scale').addEventListener('input', e => {
  state.scale = e.target.value / 100;
  $('scaleVal').textContent = e.target.value + '%';
  render();
});

function resetImage() {
  state.scale = 1; state.dx = 0; state.dy = 0;
  $('scale').value = 100;
  $('scaleVal').textContent = '100%';
  render();
}
$('resetPos').addEventListener('click', resetImage);

// drag image on preview
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (!state.img) return;
  drag = { x: e.clientX, y: e.clientY, dx: state.dx, dy: state.dy };
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = cv.width / cv.getBoundingClientRect().width;
  state.dx = drag.dx + (e.clientX - drag.x) * k;
  state.dy = drag.dy + (e.clientY - drag.y) * k;
  render();
});
const endDrag = () => { drag = null; if (state.img) cv.style.cursor = 'grab'; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  if (!state.img) return;
  e.preventDefault();
  const v = clamp(Number($('scale').value) - Math.sign(e.deltaY) * 5, 20, 250);
  $('scale').value = v;
  $('scale').dispatchEvent(new Event('input'));
}, { passive: false });

// ---------- drawing ----------
function clamp(v, a, b) { return Math.min(b, Math.max(a, isNaN(v) ? 0 : v)); }
function font(weight, size) { return `${weight} ${size}px ${FONT}`; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function starPath(cx, cy, R) {
  const r = R * 0.5;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? R : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawStar(cx, cy, R, fill) {
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineWidth = R * 0.18;
  starPath(cx, cy, R);
  ctx.fillStyle = ctx.strokeStyle = GREY_STAR;
  ctx.fill(); ctx.stroke();
  if (fill > 0) {
    ctx.beginPath();
    ctx.rect(cx - R * 1.2, cy - R * 1.2, R * 2.4 * fill, R * 2.4);
    ctx.clip();
    starPath(cx, cy, R);
    ctx.fillStyle = ctx.strokeStyle = ORANGE;
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawStars(x0, cy, R, gap, rating) {
  // 별 하나의 채움 비율은 시각적으로 보이는 영역에 맞춰 보정
  for (let i = 0; i < 5; i++) {
    const f = clamp(rating - i, 0, 1);
    const visual = f === 0 || f === 1 ? f : 0.2 + f * 0.6;
    drawStar(x0 + i * gap, cy, R, visual);
  }
}

function chevronDown(cx, cy, s, lw) {
  ctx.beginPath();
  ctx.moveTo(cx - s, cy - s / 2);
  ctx.lineTo(cx, cy + s / 2);
  ctx.lineTo(cx + s, cy - s / 2);
  ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke();
}

function wrapText(text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(/(\s+)/)) {
      if (!word) continue;
      const test = line + word;
      if (ctx.measureText(test).width <= maxW) { line = test; continue; }
      if (line.trim()) { out.push(line.trimEnd()); line = ''; }
      let w = word.trimStart();
      for (const ch of w) {
        if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ''; }
        line += ch;
      }
    }
    out.push(line.trimEnd());
  }
  return out.length ? out : [''];
}

function pillButton(x, y, w, h, label, icon) {
  ctx.fillStyle = '#efeff3';
  roundRect(x, y, w, h, 14);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.font = font(500, 32);
  ctx.textBaseline = 'middle';
  if (icon) {
    ctx.save();
    ctx.translate(x + 20, y + h / 2 - 18);
    ctx.scale(1.5, 1.5);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.9;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke(THUMB);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.fillText(label, x + 76, y + h / 2 + 2);
  } else {
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y + h / 2 + 2);
  }
}

function drawDeletedNotice(x, cy) {
  // 동그라미 느낌표 아이콘 + 안내 문구
  const r = 17, cx = x + r;
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = '#8e8e93';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 3); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy + 9, 2, 0, Math.PI * 2); ctx.fill();
  ctx.font = font(500, COMMENT_SIZE);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('이 댓글은 삭제되었습니다.', x + r * 2 + 14, cy + 1);
  ctx.restore();
}

const HEADER_H = 280;
const LINE_H = 60;
const COMMENT_SIZE = 38;
const COMMENT_MAX_W = 940;

function computeLayout() {
  ctx.font = font(400, COMMENT_SIZE);
  let y = HEADER_H;
  const blocks = state.reviews.map((r, i) => {
    const lines = wrapText(r.text, COMMENT_MAX_W);
    const top = y;
    const extra = r.deleted ? 1 : 0;
    const lastLine = top + 214 + (lines.length - 1 + extra) * LINE_H;
    const bottom = lastLine + (i === state.reviews.length - 1 ? 75 : 85);
    y = bottom;
    return { r, lines, top, bottom };
  });
  return { blocks, H: Math.max(MIN_H, Math.ceil(y)) };
}

function render(forExport = false) {
  const { blocks, H } = computeLayout();
  if (cv.height !== H) cv.height = H;

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // top bar
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(64, 58); ctx.lineTo(40, 82); ctx.lineTo(64, 106); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1022, 64); ctx.lineTo(1058, 100); ctx.moveTo(1058, 64); ctx.lineTo(1022, 100); ctx.stroke();

  const title = $('title').value;
  let ts = 42;
  ctx.font = font(700, ts);
  while (ts > 24 && ctx.measureText(title).width > 860) { ts -= 2; ctx.font = font(700, ts); }
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, W / 2, 84);

  // total rating
  const total = clamp(parseFloat($('total').value), 0, 5);
  const totalText = total.toFixed(2);
  ctx.font = font(800, 76);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#111';
  ctx.fillText(totalText, 38, 210);
  const tw = ctx.measureText(totalText).width;
  drawStars(38 + tw + 56, 207, 34, 70, total);

  // dropdowns
  const dropdown = (x, w, label) => {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.10)';
    ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
    ctx.fillStyle = '#ececf0';
    roundRect(x, 175, w, 78, 16);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#222';
    ctx.font = font(700, 32);
    ctx.textAlign = 'left';
    ctx.fillText(label, x + 24, 216);
    const lw = ctx.measureText(label).width;
    ctx.strokeStyle = '#222';
    chevronDown(x + 24 + lw + 30, 216, 10, 4);
  };
  dropdown(880, 176, '등록순');
  dropdown(705, 154, '전체');

  // reviews
  blocks.forEach((b, i) => {
    const { r, lines, top, bottom } = b;
    drawStars(64, top + 72, 19, 38, clamp(r.rating, 0, 5));

    ctx.font = font(400, 31);
    ctx.fillStyle = '#9b9b9f';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(r.who, 48, top + 124);

    pillButton(752, top + 36, 160, 70, '추천', true);
    pillButton(930, top + 36, 110, 70, '신고', false);

    ctx.font = font(400, COMMENT_SIZE);
    ctx.textAlign = 'left';
    let firstLine = top + 214;
    if (r.deleted) {
      drawDeletedNotice(48, firstLine);
      firstLine += LINE_H;
      // 원 댓글은 읽을 수 있을 정도로만 살짝 흐리게
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.filter = 'blur(1.3px)';
    }
    ctx.font = font(400, COMMENT_SIZE);
    ctx.fillStyle = '#1b1b1b';
    lines.forEach((ln, j) => ctx.fillText(ln, 48, firstLine + j * LINE_H));
    if (r.deleted) ctx.restore();

    if (i < blocks.length - 1) {
      ctx.fillStyle = '#e2e2ea';
      ctx.fillRect(12, bottom - 1, W - 12, 2);
    }
  });

  // character
  if (state.img) {
    const img = state.img;
    let baseH = H * 0.76;
    let baseW = img.width * baseH / img.height;
    if (baseW > W * 0.62) { baseW = W * 0.62; baseH = img.height * baseW / img.width; }
    const w = baseW * state.scale, h = baseH * state.scale;
    const x = W - w + state.dx, y = H - h + state.dy;
    ctx.drawImage(img, x, y, w, h);
  } else if (!forExport) {
    ctx.save();
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = '#d0d0d8';
    ctx.lineWidth = 3;
    roundRect(W * 0.42, H * 0.3, W * 0.55, H * 0.67, 24);
    ctx.stroke();
    ctx.fillStyle = '#b0b0b8';
    ctx.font = font(600, 34);
    ctx.textAlign = 'center';
    ctx.fillText('캐릭터 이미지 자리', W * 0.695, H * 0.635);
    ctx.restore();
  }
}

// ---------- export ----------
let lastBlob = null;
$('makeBtn').addEventListener('click', () => {
  render(true);
  const url = cv.toDataURL('image/png');
  cv.toBlob(b => { lastBlob = b; }, 'image/png');
  render();
  $('outImg').src = url;
  const link = $('downloadLink');
  link.href = url;
  const safe = ($('title').value || '강의평가').replace(/[\\/:*?"<>|]/g, '_');
  link.download = `${safe}_강의평가.png`;
  $('toast').textContent = '';
  $('modal').classList.add('open');
});

$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': lastBlob })]);
    $('toast').textContent = '클립보드에 복사했어요.';
  } catch (e) {
    $('toast').textContent = '이 브라우저에서는 복사가 안 돼요. 이미지 저장을 이용해 주세요.';
  }
});

$('closeBtn').addEventListener('click', () => $('modal').classList.remove('open'));
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').classList.remove('open'); });

// ---------- init ----------
renderReviewForms();
render();
Promise.all([
  document.fonts.load(font(400, 38)),
  document.fonts.load(font(500, 32)),
  document.fonts.load(font(700, 42)),
  document.fonts.load(font(800, 76)),
]).catch(() => {}).then(() => render());
</script>
</body>
</html>
